[workspace]
name = "excavator-sim"
version = "0.1.0"
description = "Desktop excavator simulator with a Python authority and Godot client"
authors = ["rosatus"]
channels = ["conda-forge"]
platforms = ["win-64"]

[feature.compatibility.dependencies]
python = "3.11.*"
pinocchio = "*"
numpy = "*"
aiohttp = "*"
jsonschema = "*"
platformdirs = "*"
pytest = "*"
pytest-asyncio = "*"
ruff = "*"
mypy = "*"

[feature.compatibility.pypi-dependencies]
rerun-sdk = "==0.35.0"
cantools = ">=40,<41"

[feature.compatibility.activation.env]
PYTHONPATH = "backend/src"

[feature.gateway.dependencies]
python = "3.11.*"
numpy = "*"
aiohttp = "*"
jsonschema = "*"
platformdirs = "*"

[feature.gateway.pypi-dependencies]
cantools = ">=40,<41"

[feature.gateway.activation.env]
PYTHONPATH = "backend/src"

[environments]
default = { features = ["compatibility"] }
gateway = { features = ["gateway"] }

[tasks]
test-backend = "python -m pytest backend/tests/backend"
lint-backend = "ruff check backend/src backend/tests backend/scripts"
format-backend = "ruff format backend/src backend/tests backend/scripts"
typecheck-backend = "mypy backend/src backend/scripts"
verify-provenance = "python backend/scripts/verify_provenance.py"
verify-standalone-paths = "python backend/scripts/verify_standalone.py --paths-only"
backend-smoke = "python backend/scripts/production_smoke.py"
soak-jolt-quick = "python backend/scripts/jolt_product_soak.py --mode quick --quality-profile balanced"
soak-jolt-release = "python backend/scripts/jolt_product_soak.py --mode release --quality-profile balanced"
soak-jolt-quality-matrix = "python backend/scripts/jolt_product_soak.py --mode quick --quality-profile low balanced high --output artifacts/benchmark/jolt-product-soak-quality-matrix.json"
verify = { depends-on = ["lint-backend", "typecheck-backend", "test-backend", "verify-provenance", "verify-standalone-paths"] }
start-gateway = "python -m babylon_sim.cli --runtime-profile gateway-only --frontend-dir godot/dist"
start-legacy = "python -m babylon_sim.cli --runtime-profile legacy --frontend-dir godot/dist"
start-python-kinematic = "python -m babylon_sim.cli --runtime-profile motion-only --frontend-dir godot/dist"
start-motion-only = "python -m babylon_sim.cli --runtime-profile motion-only --frontend-dir godot/dist"
