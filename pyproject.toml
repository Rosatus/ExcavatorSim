[project]
name = "excavator-sim-backend"
version = "0.1.0"
description = "Authoritative Python backend for the ExcavatorSim Godot client"
requires-python = ">=3.11,<3.12"
license = "AGPL-3.0-only"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["backend/tests/backend"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["backend/src", "backend/scripts"]
warn_unused_configs = true
