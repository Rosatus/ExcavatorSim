# ICT calibration parameters
# 单位：length/offset 为 m，angle/imu_car/imu_component 为 degree。
# [length]
# m_lMN: EC 固定连杆长度；m_lNQ: CD 固定连杆长度；m_lQK: DF 固定连杆长度；m_lMK: EF 固定连杆长度。
# m_lFQ: LD 小臂长度；m_lCF: AL 大臂长度；m_lQV 为铲斗长 DM，等于属具长度 + 误差补偿；bucketWidth 为铲斗宽。
# [angle]
# m_angNQF: CDL 固定夹角；m_angKQV: FDM 固定夹角。
# [imu_car]
# roll: 车身 IMU 横滚角安装误差；pitch: 车身 IMU 俯仰角安装误差；yaw: 车身 IMU 航向角安装误差。
# [imu_component]
# pitch_boom: 动臂 IMU 俯仰角安装误差；pitch_arm: 斗杆 IMU 俯仰角安装误差；pitch_bucket: 铲斗 IMU 俯仰角安装误差。
# [offset]
# OC_Tx/OC_Ty/OC_Tz: 天线到车体原点 X/Y/Z 向偏移；GO_Tx/GO_Ty/GO_Tz: GNSS 到工作装置原点 X/Y/Z 向偏移。
# [slew_sensor]
# calibrated: 回转传感器零点标定状态（true/false）。
# [swing_boom_sensor]
# calibrated: 偏摆传感器零点标定状态（true/false）。
# [sensor]
# type: 传感器类型（RootPilotOEM 或 legacy）。

